<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Outer Golden Halo / Shield Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.85" />
  <circle cx="256" cy="256" r="176" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6 8" opacity="0.4" />

  <!-- Left Leaf -->
  <path d="M256,370 C170,350 110,270 125,185 C175,160 240,205 256,370 Z" fill="url(#leafGrad)" filter="url(#shadow)" />
  <path d="M256,370 C200,310 160,240 145,190 C180,180 230,225 256,370 Z" fill="#6ee7b7" opacity="0.6" />

  <!-- Right Leaf -->
  <path d="M256,370 C345,340 405,250 385,160 C335,140 270,190 256,370 Z" fill="#047857" filter="url(#shadow)" />
  <path d="M256,370 C315,300 360,225 365,165 C330,160 280,210 256,370 Z" fill="#10b981" opacity="0.8" />

  <!-- Center Stem -->
  <path d="M251,410 L261,410 L259,320 L256,220 L253,320 Z" fill="#d1fae5" />

  <!-- Center Water Droplet (Fertirriego / Agroquímicos) -->
  <path d="M256,215 C256,215 305,285 305,330 C305,360 283,380 256,380 C229,380 207,360 207,330 C207,285 256,215 256,215 Z" fill="url(#dropGrad)" filter="url(#shadow)" />
  <!-- Droplet Highlight -->
  <path d="M242,280 C234,295 232,315 233,330 C230,320 232,295 240,285 Z" fill="#ffffff" opacity="0.85" />
  <circle cx="240" cy="275" r="5" fill="#ffffff" opacity="0.9" />

  <!-- Gold Star Certification at bottom -->
  <circle cx="256" cy="430" r="14" fill="url(#goldGrad)" />
  <polygon points="256,420 259,427 267,427 261,432 263,440 256,435 249,440 251,432 245,427 253,427" fill="#ffffff" />
</svg>
